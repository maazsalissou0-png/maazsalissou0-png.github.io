<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap');

  :root{
    --bg-1:#0b0e14;
    --bg-2:#12161f;
    --accent:#6ee7c9;
    --accent-2:#7c8cf8;
    --text:#e8ecf1;
    --text-dim:#8993a6;
    --glass:rgba(255,255,255,0.045);
    --glass-border:rgba(255,255,255,0.09);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,140,248,0.16), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(110,231,201,0.13), transparent 45%),
      var(--bg-1);
    color:var(--text);
    overflow:hidden;
    position:relative;
  }

  /* particules ambiantes */
  .particle{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(110,231,201,0.5), transparent 70%);
    filter:blur(1px);
    animation:float 14s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) translateX(0); }
    50%{ transform:translateY(-30px) translateX(15px); }
  }

  .card{
    position:relative;
    width:100%;
    max-width:380px;
    margin:24px;
    padding:44px 36px 36px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:20px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    animation:rise 0.7s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(24px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .mark{
    width:44px; height:44px;
    border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    margin-bottom:22px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    color:#0b0e14;
    font-size:18px;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:24px;
    letter-spacing:-0.02em;
    margin-bottom:6px;
  }

  .subtitle{
    color:var(--text-dim);
    font-size:14px;
    margin-bottom:32px;
  }

  .field{
    position:relative;
    margin-bottom:18px;
  }

  label{
    display:block;
    font-size:12px;
    font-weight:500;
    color:var(--text-dim);
    margin-bottom:7px;
    letter-spacing:0.02em;
  }

  input{
    width:100%;
    padding:13px 14px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--glass-border);
    border-radius:10px;
    color:var(--text);
    font-size:14px;
    font-family:'Inter', sans-serif;
    transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  input::placeholder{ color:#4b5468; }
  input:focus{
    outline:none;
    border-color:var(--accent);
    background:rgba(255,255,255,0.05);
    box-shadow:0 0 0 3px rgba(110,231,201,0.12);
  }

  .btn{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#0b0e14;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 26px -10px rgba(110,231,201,0.45);
  }
  .btn:active{ transform:translateY(0); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }

  .error{
    color:#ff8a8a;
    font-size:12.5px;
    margin-top:-8px;
    margin-bottom:14px;
    min-height:16px;
  }

  .toggle{
    position:absolute;
    right:12px;
    top:37px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .toggle:hover{ color:var(--text); }

  /* écran de bienvenue après connexion */
  .welcome{
    display:none;
    text-align:center;
    animation:rise 0.5s cubic-bezier(.16,1,.3,1) both;
  }
  .welcome .avatar{
    width:64px; height:64px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:24px;
    color:#0b0e14;
  }
  .welcome h1{ margin-bottom:8px; }
  .welcome p{ color:var(--text-dim); font-size:14px; margin-bottom:26px; }
  .logout{
    background:none;
    border:1px solid var(--glass-border);
    color:var(--text-dim);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    transition:all .2s ease;
  }
  .logout:hover{ color:var(--text); border-color:rgba(255,255,255,0.2); }
</style>
</head>
<body>

  <div class="card">
    <div id="loginView">
      <div class="mark">•</div>
      <h1>Connexion</h1>
      <p class="subtitle">Entrez votre nom et votre mot de passe</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="nom">Nom</label>
          <input type="text" id="nom" placeholder="Votre nom" autocomplete="name">
        </div>
        <div class="field">
          <label for="mdp">Mot de passe</label>
          <input type="password" id="mdp" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle" id="toggleMdp">afficher</button>
        </div>
        <div class="error" id="errorMsg"></div>
        <button type="submit" class="btn" id="submitBtn">Se connecter</button>
      </form>
    </div>

    <div class="welcome" id="welcomeView">
      <div class="avatar" id="avatarInit">•</div>
      <h1 id="welcomeText">Bienvenue</h1>
      <p>Vous êtes connecté(e).</p>
      <button class="logout" id="logoutBtn">Se déconnecter</button>
    </div>
  </div>

<script>
  // particules décoratives
  const colors = ['80px','120px','60px'];
  for(let i=0;i<5;i++){
    const p = document.createElement('div');
    p.className='particle';
    const size = 60 + Math.random()*120;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = Math.random()*100+'%';
    p.style.top = Math.random()*100+'%';
    p.style.animationDelay = (Math.random()*6)+'s';
    p.style.animationDuration = (10+Math.random()*8)+'s';
    document.body.appendChild(p);
  }

  const form = document.getElementById('loginForm');
  const nomInput = document.getElementById('nom');
  const mdpInput = document.getElementById('mdp');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');
  const toggleMdp = document.getElementById('toggleMdp');
  const loginView = document.getElementById('loginView');
  const welcomeView = document.getElementById('welcomeView');
  const welcomeText = document.getElementById('welcomeText');
  const avatarInit = document.getElementById('avatarInit');
  const logoutBtn = document.getElementById('logoutBtn');

  toggleMdp.addEventListener('click', () => {
    const isPwd = mdpInput.type === 'password';
    mdpInput.type = isPwd ? 'text' : 'password';
    toggleMdp.textContent = isPwd ? 'masquer' : 'afficher';
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const nom = nomInput.value.trim();
    const mdp = mdpInput.value;

    if(!nom || !mdp){
      errorMsg.textContent = 'Veuillez remplir les deux champs.';
      return;
    }
    errorMsg.textContent = '';

    submitBtn.disabled = true;
    submitBtn.textContent = 'Connexion...';

    setTimeout(() => {
      welcomeText.textContent = `Bienvenue, ${nom}`;
      avatarInit.textContent = nom.charAt(0).toUpperCase();
      loginView.style.display = 'none';
      welcomeView.style.display = 'block';
    }, 600);
  });

  logoutBtn.addEventListener('click', () => {
    welcomeView.style.display = 'none';
    loginView.style.display = 'block';
    form.reset();
    submitBtn.disabled = false;
    submitBtn.textContent = 'Se connecter';
  });
</script>
</body>
</html>
